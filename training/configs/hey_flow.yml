# Training config for the "hey flow" wake word.
#
# Run from the training venv, through training/train.py. Calling
# `-m openwakeword.train` directly cannot finish on Windows: train.py applies
# the six patches that make it possible, and says why at each one.
#   training\.venv\Scripts\python.exe training\train.py \
#       --training_config training\configs\hey_flow.yml \
#       --generate_clips --augment_clips --train_model
#
# Paths below are relative to the repo root and are filled in by
# training/setup.ps1. Nothing here is downloaded by the app at runtime.

target_phrase:
  - "hey flow"
model_name: hey_flow
model_type: dnn
layer_size: 32

# --- the phonetic problem, stated as data -----------------------------------
#
# "hey flow" is two syllables and "flow" is a common word with a very common
# vowel shape, so it sits close to a lot of ordinary speech. Rather than argue
# about whether that matters, the confusables go in as explicit negatives and
# the model is taught to reject them. This list is the single most important
# thing in this file: every entry here is a phrase that would otherwise have a
# real chance of starting a recording during a meeting.
custom_negative_phrases:
  - "hello"
  - "hello there"
  - "hey Joe"
  - "hey bro"
  - "hey so"
  - "hey no"
  - "hey now"
  - "they know"
  - "they flow"
  - "the flow"
  - "a flow"
  - "cash flow"
  - "work flow"
  - "workflow"
  - "flow chart"
  - "flow of"
  - "in the flow"
  - "hey though"
  - "hey load"
  - "hey local"
  - "okay flow"

# --- synthetic positives ------------------------------------------------------
# Generated by piper across many voices, speeds and pitches. More samples means
# a better model and a longer generation run; 30k is the point where returns
# start flattening for a two-word phrase.
n_samples: 30000
n_samples_val: 2000
tts_batch_size: 50

# --- augmentation -------------------------------------------------------------
# Reverb and background noise, so the model works in a room rather than only on
# clean synthetic audio. Without this it falls apart the moment there is a fan,
# a keyboard, or a second person in the room.
augmentation_rounds: 1
augmentation_batch_size: 16
background_paths_duplication_rate:
  - 1

# --- training -----------------------------------------------------------------
steps: 50000
batch_n_per_class:
  ACAV100M_sample: 1024
  adversarial_negative: 50
  positive: 50
max_negative_weight: 1500

# The metric that actually decides whether this wake word is usable. The
# trainer selects checkpoints against it, so it is a target rather than a
# report. 0.2 per hour is one false start every five hours.
#
# Treat the number the trainer prints at the end as indicative only. It counts
# single frames over the threshold, while LocalFlow requires wake_patience
# consecutive frames and then debounces, and it divides by a hardcoded 11.3
# hours when the validation features are 10.70. Measured through the real rule,
# this model came out at 0.47/hour where the trainer reported 1.42.
target_false_positives_per_hour: 0.2

total_length: 16000
# train.py appends model_name to this itself, so naming the phrase here too
# would produce output/hey_flow/hey_flow/.
output_dir: training/output

# --- data paths, filled in by training/setup.ps1 ------------------------------
piper_sample_generator_path: training/piper-sample-generator
# The 16khz/ subdirectory, not its parent. train.py builds this list with a
# flat os.scandir and hands every entry straight to the audio loader, so a
# README or a nested directory alongside the clips is a crash.
rir_paths:
  - training/data/rirs/16khz
# The wav/ subdirectory, not the parquet above it: AudioSet now ships as
# parquet and torch_audiomentations needs real audio files. See
# training/prepare_background.py.
background_paths:
  - training/data/background/wav
feature_data_files:
  ACAV100M_sample: training/data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy
false_positive_validation_data_path: training/data/validation_set_features.npy
