[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localflow"
version = "0.1.0"
description = "Offline push-to-talk dictation for Windows. No audio, text, or telemetry leaves the machine."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# GitHub's noreply address rather than a real inbox. Package metadata is
# published to PyPI and mirrored by countless indexes, so a real address here is
# a scraping target for the life of the project. This one still reaches the
# author through GitHub.
authors = [{ name = "Ashrit Chattani", email = "60252193+crazyashking@users.noreply.github.com" }]
keywords = ["dictation", "speech-to-text", "whisper", "offline", "local", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Loose lower bounds, for anyone installing this as a package. They are NOT
# how this project is meant to be installed: requirements.txt pins all 42
# packages to an exact version and SHA256, and that is the reproducible path.
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pywin32>=306",
    # Both are imported directly by the wake word. onnxruntime arrives with
    # faster-whisper as well, and is named here because wake.py depends on it
    # in its own right rather than through anything else.
    "openwakeword>=0.6",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/crazyashking/localflow"
Issues = "https://github.com/crazyashking/localflow/issues"

[project.scripts]
localflow = "localflow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["localflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]

# No per-file-ignores on purpose. Import order is load-bearing in two places
# and cannot be sorted (the NVIDIA DLL directories must be registered before
# anything pulls in ctranslate2, and the bench scripts have to extend sys.path
# before importing localflow), but those sites carry an explicit `# noqa: E402`
# each, so the exception stays visible at the line it applies to.
